spring:
  application:
    name: Bootstrap Spring Boot
  autoconfigure:
    # redisson-spring-boot-starter auto-config unconditionally connects to
    # localhost:6379 at startup; our own CacheProviderConfiguration wires the
    # client only when arex.cache.provider=redis, so disable the starter here.
    exclude: org.redisson.spring.starter.RedissonAutoConfigurationV2
  jackson:
    default-property-inclusion: non_null
    serialization:
      FAIL_ON_EMPTY_BEANS: false
  datasource:
    url: ${AREX_MYSQL_URL:jdbc:mysql://localhost:3306/arex_storage_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${AREX_MYSQL_USER:root}
    password: ${AREX_MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  profiles:
    active: prod
mybatis:
  configuration:
    map-underscore-to-camel-case: true
arex:
  cache:
    # cache/lock provider: local(in-process, single instance) | redis(shared, multi instance)
    provider: ${AREX_CACHE_PROVIDER:local}
  api:
    config:
      addExclusion:
        url: ${arex.api.service.api}/api/config/comparison/exclusions/batchModify/INSERT
      application:
        url: ${arex.api.service.api}/api/config/application/useResult/appId/{appId}
      applicationService:
        url: ${arex.api.service.api}/api/config/applicationService/useResultAsList/appId/{appId}
      comparison:
        summary:
          url: ${arex.api.service.api}/api/config/comparison/summary/queryByAppId/{appId}
        queryCompareConfig:
          url: ${arex.api.service.api}/api/config/comparison/summary/queryCompareConfig
      schedule:
        url: ${arex.api.service.api}/api/config/schedule/useResult/appId/{appId}
      system:
        url: ${arex.api.service.api}/api/system/config/list
    init:
      url: ${arex.api.service.api}/api/report/init
    push:
      compareResult:
        url: ${arex.api.service.api}/api/report/analyzeCompareResults
      replayStatus:
        url: ${arex.api.service.api}/api/report/pushReplayStatus
    queryPlanStatistic:
      url: ${arex.api.service.api}/api/report/queryPlanStatistic
    remove:
      errorMsg:
        url: ${arex.api.service.api}/api/report/removeErrorMsg
      records:
        url: ${arex.api.service.api}/api/report/removeRecordsAndScenes
    update:
      report:
        info:
          url: ${arex.api.service.api}/api/report/updateReportInfo
    delete:
      planItemStatistics:
        url: ${arex.api.service.api}/api/report/deletePlanItemStatistics
  client:
    https:
      cert:
        disable: true
  connect:
    time:
      out: 10000
  prometheus:
    port: 20092
  read:
    time:
      out: 10000
  retry:
    back:
      'off':
        period: 1000
    max:
      attempts: 2
  schedule:
    # persistence backend: mysql | mongodb(legacy)
    repository:
      type: ${AREX_SCHEDULE_REPOSITORY_TYPE:mysql}
    bizLog:
      secondToSave: 30
      sizeToSave: 100
    monitor:
      secondToRefresh: 5
    pool:
      io:
        cpuratio: 4
    compare:
      case:
        url: ${arex.schedule.service.api}/api/compareCase
  storage:
    cacheLoad:
      url: ${arex.storage.service.api}/api/storage/replay/query/cacheLoad
    cacheRemove:
      url: ${arex.storage.service.api}/api/storage/replay/query/cacheRemove
    countByRange:
      url: ${arex.storage.service.api}/api/storage/replay/query/countByRange
    clearScene:
      url: ${arex.storage.service.api}/api/scene/clearReplayPool/
    replayCase:
      url: ${arex.storage.service.api}/api/storage/replay/query/replayCase
    replayResult:
      url: ${arex.storage.service.api}/api/storage/replay/query/replayResult
    viewRecord:
      url: ${arex.storage.service.api}/api/storage/replay/query/viewRecord
  replay:
    header:
      excludes:
        dubbo: async
        http:
auto:
  rerun:
    threshold: 1.0
pom:
  version: ${project.version}
replay:
  sender:
    extension:
      jarPath:
      # Optional comma-separated extra jars (file path or http url) loaded into the
      # same class loader as Dubbo, used to plug in a custom Dubbo Protocol/SPI
      # that dubboInvoker.jar does not bundle. Leave empty to keep default behavior.
      extraJarPaths:
      switch: true